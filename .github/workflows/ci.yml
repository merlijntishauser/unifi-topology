name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Typecheck (pyright)
        run: pyright

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Xenon complexity check
        run: python -m xenon src/unifi_topology --max-absolute C --max-modules B --max-average A
      - name: Max complexity 12
        run: |
          high_complexity=$(python -m radon cc src/unifi_topology -s | grep -E " - C \(1[3-9]\)| - C \(20\)| - D \(| - E \(| - F \(" || true)
          if [ -n "$high_complexity" ]; then
            echo "Functions with complexity > 12 found:"
            echo "$high_complexity"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Dependency audit
        run: pip-audit

  test-unit:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, complexity, audit]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Unit tests
        run: pytest -q -m unit

  test-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Integration tests
        run: pytest -q -m integration

  test-contract:
    runs-on: ubuntu-latest
    needs: test-integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -e . -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Contract tests
        run: pytest -q -m contract

  build:
    runs-on: ubuntu-latest
    needs: test-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
            requirements-build.txt
            requirements-dev.txt
      - name: Build dist
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install build -c constraints.txt
          python -m build
