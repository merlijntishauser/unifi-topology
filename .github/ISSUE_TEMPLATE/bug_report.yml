name: Bug Report
description: Report a bug in unifi-topology
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps or code snippet to reproduce the issue.
      placeholder: |
        ```python
        from unifi_topology import ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include tracebacks if applicable.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python -c "import unifi_topology; print(unifi_topology.__version__)"`.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "3.13"
    validations:
      required: true
